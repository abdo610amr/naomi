<style>
:root {
  --ink: #120f0c;
  --ink-2: #1b1713;
  --line: #3a3126;
  --gold: #e9b949;
  --gold-hi: #ffe39a;
  --gold-lo: #b9822a;
  --text: #efe6d4;
  --muted: #a89980;
  --display: "Cinzel Decorative", "Times New Roman", serif;
  --body: "Jost", "Helvetica Neue", Arial, sans-serif;
  --arabic: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --script: "Yellowtail", "Brush Script MT", cursive;
  --calli: "Aref Ruqaa", "Cairo", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 120px); height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--ink);
  background-image:
    radial-gradient(ellipse at 50% -10%, #2a2118 0%, transparent 60%),
    repeating-radial-gradient(circle at 50% 100%, transparent 0 22px, rgba(233,185,73,.035) 22px 23px);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--body);
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
 
/* Hero */
.hero { text-align: center; padding: 56px 20px 36px; }
.hero .mark { width: 54px; height: 54px; margin: 0 auto 6px; color: var(--gold); opacity: .9; }
.hero .ar {
  font-family: var(--calli); font-size: clamp(64px, 18vw, 112px); line-height: 1.05; margin: 0;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero .en {
  font-family: var(--script); font-size: clamp(44px, 12vw, 72px); line-height: 1; margin: -6px 0 0;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, var(--gold-lo));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero .sub { letter-spacing: .38em; font-size: 12.5px; color: var(--muted); margin: 14px 0 0; }
.hero .hint { margin: 26px auto 0; max-width: 34ch; color: var(--muted); font-size: 15px; }
 
/* Sticky nav */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(18,15,12,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding-top: 10px;
}
.bar-inner { max-width: 880px; margin: 0 auto; padding: 0 16px; }
.search { position: relative; }
.search input {
  width: 100%; font: inherit; color: var(--text);
  background: var(--ink-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 11px 18px 11px 44px; outline: none;
}
.search input::placeholder { color: var(--muted); }
.search input:focus-visible { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(233,185,73,.25); }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.groups, .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.groups::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
.groups { padding: 10px 0 6px; }
.chips { padding: 4px 0 10px; }
.tab, .chip {
  flex: 0 0 auto; font: inherit; cursor: pointer; white-space: nowrap;
  background: transparent; color: var(--muted); border: 0;
}
.tab { font-family: var(--display); font-size: 14px; padding: 6px 12px; border-bottom: 2px solid transparent; }
.tab[aria-current="true"] { color: var(--gold); border-bottom-color: var(--gold); }
.chip { font-size: 14px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; }
.chip[aria-current="true"] { background: var(--gold); border-color: var(--gold); color: #1a1208; font-weight: 600; }
.tab:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.tab:hover, .chip:hover { color: var(--gold-hi); }
.chip[aria-current="true"]:hover { color: #1a1208; }
 
/* Sections */
main { max-width: 880px; margin: 0 auto; padding: 8px 16px 40px; }
.group-title { text-align: center; margin: 56px 0 4px; font-family: var(--display); font-size: 13px; letter-spacing: .3em; color: var(--muted); }
section { padding: 36px 0 8px; }
.sec-head { text-align: center; margin-bottom: 18px; }
.orn { width: 70px; height: 14px; color: var(--gold); display: block; margin: 0 auto 6px; }
.sec-head h2 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 6vw, 38px); line-height: 1.15; margin: 0; color: var(--gold); }
.sec-head .ar-title { font-family: var(--calli); font-size: 24px; color: var(--gold-lo); margin-top: 2px; }
.sec-head .note { color: var(--muted); font-size: 14px; margin-top: 2px; }
 
.items { list-style: none; margin: 0; padding: 0; }
.item {
  display: grid; grid-template-columns: 1fr auto; column-gap: 16px; row-gap: 2px;
  padding: 13px 0; border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; }
.en-name { font-weight: 600; color: var(--gold); font-size: 17px; }
.en-desc { color: var(--text); font-size: 14.5px; opacity: .86; white-space: pre-line; max-width: 52ch; }
.price { grid-column: 2; grid-row: 1; text-align: right; font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
.price small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 3px; }
.price .two { display: inline-flex; gap: 14px; }
.price .two span { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.price .two em { font-style: normal; font-size: 11px; color: var(--muted); font-weight: 400; }
.ar-block { grid-column: 1 / -1; direction: rtl; text-align: right; font-family: var(--arabic); color: var(--text); margin-top: 2px; }
.ar-name { font-weight: 600; font-size: 16px; }
.ar-desc { font-size: 14px; opacity: .8; white-space: pre-line; }
 
@media (min-width: 720px) {
  .item { grid-template-columns: minmax(0,1.3fr) 130px minmax(0,1.1fr); column-gap: 20px; align-items: start; }
  .price { grid-column: 2; grid-row: 1; text-align: center; }
  .price .two { justify-content: center; }
  .ar-block { grid-column: 3; grid-row: 1; margin-top: 0; }
  .item.noar .price { grid-column: 3; text-align: right; }
}
 
.empty { text-align: center; color: var(--muted); padding: 64px 0; display: none; }
footer { text-align: center; padding: 20px 20px 60px; color: var(--muted); }
footer .best { font-family: var(--display); color: var(--gold); font-size: 15px; }
footer p { margin: 8px 0 0; font-size: 13px; }
.top {
  position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gold); background: var(--ink);
  color: var(--gold); cursor: pointer; display: none; place-items: center; z-index: 30;
}
.top.show { display: grid; }
.top:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.top svg { width: 18px; height: 18px; }
</style>
</head>

const ORN = '<svg class="orn" viewBox="0 0 70 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 7h24M44 7h24"/><path d="M35 1l4 6-4 6-4-6z" fill="currentColor"/><circle cx="26" cy="7" r="1.4" fill="currentColor"/><circle cx="44" cy="7" r="1.4" fill="currentColor"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => String(n);
 
function priceHtml(p, labels) {
  if (Array.isArray(p)) {
    return '<span class="two">' + p.map((v,i) => `<span>${fmt(v)}<em>${esc(labels[i])}</em></span>`).join("") + '</span><small>LE</small>';
  }
  return `${fmt(p)}<small>LE</small>`;
}
 
const menu = document.getElementById("menu");
let curGroup = null;
S.forEach(s => {
  if (s.g !== curGroup) {
    curGroup = s.g;
    const h = document.createElement("div");
    h.className = "group-title"; h.id = "g-" + s.g; h.dataset.group = s.g; h.textContent = G[s.g];
    menu.appendChild(h);
  }
  const el = document.createElement("section");
  el.id = s.id; el.dataset.group = s.g;
  el.innerHTML = `
    <div class="sec-head">${ORN}<h2>${esc(s.en)}</h2><div class="ar-title" lang="ar" dir="rtl">${esc(s.ar)}</div>${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}</div>
    <ul class="items">${s.items.map(it => {
      const [en, ar, price, de, da] = it;
      const hasAr = !!(ar || da);
      const hay = [en, ar || "", de || "", da || ""].join(" ").toLowerCase();
      return `<li class="item ${hasAr ? "" : "noar"}" data-hay="${esc(hay)}">
        <div class="en"><div class="en-name">${esc(en)}</div>${de ? `<div class="en-desc">${esc(de)}</div>` : ""}</div>
        <div class="price">${priceHtml(price, s.labels)}</div>
        ${hasAr ? `<div class="ar-block" lang="ar" dir="rtl">${ar ? `<div class="ar-name">${esc(ar)}</div>` : ""}${da ? `<div class="ar-desc">${esc(da)}</div>` : ""}</div>` : ""}
      </li>`;
    }).join("")}</ul>`;
  menu.appendChild(el);
});
 
// Navigation
const groupsEl = document.getElementById("groups");
const chipsEl = document.getElementById("chips");
Object.keys(G).forEach(k => {
  const b = document.createElement("button");
  b.className = "tab"; b.textContent = G[k]; b.dataset.group = k; b.setAttribute("role","tab");
  b.addEventListener("click", () => {
    const first = S.find(s => s.g === k);
    document.getElementById(first.id).scrollIntoView();
  });
  groupsEl.appendChild(b);
});
S.forEach(s => {
  const a = document.createElement("button");
  a.className = "chip"; a.textContent = s.en.replace("Main Course: ", ""); a.dataset.id = s.id; a.dataset.group = s.g;
  a.addEventListener("click", () => document.getElementById(s.id).scrollIntoView());
  chipsEl.appendChild(a);
});
 
function setActive(id) {
  const s = S.find(x => x.id === id); if (!s) return;
  groupsEl.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.group === s.g));
  let activeChip = null;
  chipsEl.querySelectorAll(".chip").forEach(c => {
    c.hidden = c.dataset.group !== s.g;
    const on = c.dataset.id === id;
    c.setAttribute("aria-current", on);
    if (on) activeChip = c;
  });
  if (activeChip) {
    const left = activeChip.offsetLeft - chipsEl.clientWidth / 2 + activeChip.clientWidth / 2;
    chipsEl.scrollTo({ left: Math.max(0, left), behavior: "smooth" });
  }
}
setActive(S[0].id);
 
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
}, { rootMargin: "-170px 0px -65% 0px" });
document.querySelectorAll("main section").forEach(sec => io.observe(sec));
 
// Search
const q = document.getElementById("q");
const empty = document.getElementById("empty");
q.addEventListener("input", () => {
  const term = q.value.trim().toLowerCase();
  let total = 0;
  document.querySelectorAll("main section").forEach(sec => {
    let shown = 0;
    sec.querySelectorAll(".item").forEach(li => {
      const ok = !term || li.dataset.hay.includes(term);
      li.hidden = !ok; if (ok) shown++;
    });
    sec.hidden = shown === 0; total += shown;
  });
  document.querySelectorAll(".group-title").forEach(t => {
    const any = [...document.querySelectorAll(`main section[data-group="${t.dataset.group}"]`)].some(s => !s.hidden);
    t.hidden = !any;
  });
  empty.style.display = total === 0 ? "block" : "none";
});
 
// Back to top
const topBtn = document.getElementById("top");
addEventListener("scroll", () => topBtn.classList.toggle("show", scrollY > 900), { passive: true });
topBtn.addEventListener("click", () => scrollTo({ top: 0 }));
